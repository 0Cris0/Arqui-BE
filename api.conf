server {
    server_name www.primordialdomain.me primordialdomain.me;
    location / {
        proxy_pass http://localhost:3000;

        # https://www.nginx.com/resources/wiki/start/topics/examples/forwarded/
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # http://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_redirect
        # To not redirect, but to proxy
        proxy_redirect off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/primordialdomain.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/primordialdomain.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
    
}
server {
    if ($host = www.primordialdomain.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = primordialdomain.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.primordialdomain.me primordialdomain.me;
    return 404; # managed by Certbot


}